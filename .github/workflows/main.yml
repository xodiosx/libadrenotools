name: Android CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r23c

    - name: Install Dependencies
      run: |
        # Install ARM64 cross-compiler
        sudo apt-get update
        sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

        # Build bin2c from source (single C file)
        git clone --depth 1 https://github.com/zhaojh329/bin2c.git
        cd bin2c
        cc bin2c.c -o bin2c
        sudo mv bin2c /usr/local/bin/
        cd ..

    - name: Generate ASM Header
      run: |
        chmod +x build_asm.sh
        ./build_asm.sh

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libadrenotools
        path: build/libadrenotools.so
