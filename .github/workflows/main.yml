name: Android CI

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r23c

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu

        # Download bin2c source from the working repo and compile
        curl -L -o bin2c.tar.gz https://github.com/gwilymk/bin2c/archive/refs/heads/master.tar.gz
        tar xzf bin2c.tar.gz
        cd bin2c-master
        cc bin2c.c -o bin2c
        sudo mv bin2c /usr/local/bin/
        cd ..

    - name: Generate ASM Header
      run: |
        chmod +x build_asm.sh
        ./build_asm.sh

    - name: Configure CMake
      run: |
        cmake -B build \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_SHARED_LIBS=ON

    - name: Build
      run: cmake --build build --config Release

    - name: List built libraries (debug)
      run: find build -type f \( -name "*.so" -o -name "*.a" \)

    - name: Upload Artifact (any .so file)
      uses: actions/upload-artifact@v4
      with:
        name: libadrenotools
        path: |
          build/**/*.so
          build/**/*.a
