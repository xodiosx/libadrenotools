name: Build Turnip for Android (SurfaceFlinger + AHB, Vulkan 1.4)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (e.g., mesa-26.0.6)'
        required: true
        default: 'main'
      api_override:
        description: 'Vulkan API override version (e.g., 1.4.301)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm]      # builds for both 64‑bit and 32‑bit ARM
    steps:
      - name: Install host tools (meson 1.4.0)
        run: |
          sudo apt update
          sudo apt install -y ninja-build python3-mako glslang-tools flex bison curl
          pip install --user meson==1.4.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download and setup Android NDK (r27c)
        run: |
          NDK_VERSION="r27c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q ${NDK_ZIP} -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          chmod +x /opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/*

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.mesa_version }} \
            https://gitlab.freedesktop.org/mesa/mesa.git ~/mesa

      # -------------------- Patches (only what's needed for Turnip + Android) --------------------
      - name: Apply necessary patches
        run: |
          cd ~/mesa
          # Disable the build-time Android detection so we can cross‑compile with the NDK
          curl -sSfL "https://raw.githubusercontent.com/termux/termux-packages/master/packages/mesa/0000-disable-android-detection.patch" | patch -N -p1

          # pthread_mutex -> mtx_ fix (required for Termux/Bionic compatibility)
          sed -i 's/pthread_mutex_lock(&dev->pipeline_mutex)/mtx_lock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc
          sed -i 's/pthread_mutex_unlock(&dev->pipeline_mutex)/mtx_unlock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc

          # Optional: unofficial Adreno 710/720 support
          curl -sSfL "https://raw.githubusercontent.com/termux/termux-packages/master/packages/mesa/0016-unofficial_support_adreno_710_720.patch" | patch -N -p1

      # -------------------- API Version Override (fixed) --------------------
      - name: Override Vulkan API version
        if: github.event.inputs.api_override != ''
        run: |
          cd ~/mesa
          VER="${{ github.event.inputs.api_override }}"
          DEVFILE=$(find src/freedreno/vulkan -maxdepth 1 -name 'tu_device.*' -print -quit)
          if [ -z "$DEVFILE" ]; then
            echo "❌ Could not find tu_device file"
            exit 1
          fi
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          echo "Forcing API version to ${MAJOR}.${MINOR}.${PATCH} in $DEVFILE"
          sed -i -E "s/(api[_ ]?[Vv]ersion\s*=\s*).*;/\1VK_MAKE_API_VERSION(${MAJOR}, ${MINOR}, ${PATCH});/" "$DEVFILE"

      # -------------------- Cross file (NDK + Android) --------------------
      - name: Create Meson cross file for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            CPU_FAMILY="aarch64"
            CPU="aarch64"
            TARGET="aarch64-linux-android"
          else
            CPU_FAMILY="arm"
            CPU="armv7l"
            TARGET="armv7a-linux-androideabi"
          fi
          API_LEVEL=28
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          > ~/cross_file.txt
          echo "[host_machine]" >> ~/cross_file.txt
          echo "system = 'android'" >> ~/cross_file.txt        # ← Android, not linux
          echo "cpu_family = '${CPU_FAMILY}'" >> ~/cross_file.txt
          echo "cpu = '${CPU}'" >> ~/cross_file.txt
          echo "endian = 'little'" >> ~/cross_file.txt
          echo "" >> ~/cross_file.txt
          echo "[binaries]" >> ~/cross_file.txt
          echo "c = '${NDK_BIN}/${TARGET}${API_LEVEL}-clang'" >> ~/cross_file.txt
          echo "cpp = '${NDK_BIN}/${TARGET}${API_LEVEL}-clang++'" >> ~/cross_file.txt
          echo "ar = '${NDK_BIN}/llvm-ar'" >> ~/cross_file.txt
          echo "strip = '${NDK_BIN}/llvm-strip'" >> ~/cross_file.txt
          echo "pkgconfig = 'pkg-config'" >> ~/cross_file.txt   # standard pkg-config, no wrapper needed

      # -------------------- Configure (Android + Turnip only) --------------------
      - name: Configure Mesa build for Turnip
        run: |
          meson setup build ~/mesa \
            --cross-file ~/cross_file.txt \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dllvm=disabled \
            -Dbuildtype=release \
            -Dprefix=/usr \
            -Dstrip=true \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dshared-glapi=disabled \
            -Dshader-cache=disabled \
            -Dfreedreno-kmds=msm,kgsl \
            -Dxmlconfig=disabled \
            -Dvalgrind=disabled \
            -Dzstd=disabled \
            -Dandroid-libbacktrace=disabled

      - name: Build Turnip
        run: ninja -C build

      - name: Package artifact for ${{ matrix.arch }}
        run: |
          mkdir -p turnip_out
          cp build/src/freedreno/vulkan/libvulkan_freedreno.so turnip_out/
          if [ "${{ matrix.arch }}" = "arm" ]; then
            TARNAME=turnip-android-${{ github.event.inputs.mesa_version }}-arm.tar.xz
          else
            TARNAME=turnip-android-${{ github.event.inputs.mesa_version }}-aarch64.tar.xz
          fi
          tar -cJf $TARNAME -C turnip_out .
          echo "artifact_name=$TARNAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-android-${{ github.event.inputs.mesa_version }}-${{ matrix.arch }}
          path: turnip-android-${{ github.event.inputs.mesa_version }}-*.tar.xz
