name: Build Turnip for Termux (Bionic + Vulkan 1.4)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (e.g., mesa-26.0.6)'
        required: true
        default: 'main'
      api_override:
        description: 'Vulkan API override version (e.g., 1.4.301)'
        required: false
        default: '1.4.301'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm]
    steps:
      - name: Install host build tools (minimal)
        run: |
          sudo apt update
          sudo apt install -y meson ninja-build pkg-config python3-mako python3-pip \
            glslang-tools flex bison curl ca-certificates

      - name: 
        run: |
           sudo apt update
           sudo apt install -y ninja-build pkg-config python3-mako python3-pip \
           glslang-tools flex bison curl ca-certificates
           pip install --user meson==1.4.0   # or just 'meson' for latest
           echo "$HOME/.local/bin" >> $GITHUB_PATH   # ensure pip-installed meson is found

      - name: Download and setup Android NDK (manual)
        run: |
          NDK_VERSION="r27c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://dl.google.com/android/repository/${NDK_ZIP}"
          unzip -q ${NDK_ZIP} -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          chmod +x /opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/*

      - name: Setup Termux sysroot (same as Wine build)
        run: |
          mkdir termux && cd termux
          wget -q https://github.com/xodiosx/Wine-arm64ce/releases/download/wine-14/termux-rootfs.tar
          tar xf termux-rootfs.tar
          sudo mv data /data
          sudo chown -R $(whoami):$(whoami) /data
          mkdir -p /data/data/com.termux/files/usr/tmp
          sudo chmod -R a+rX /data/data/com.termux/files/usr

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.mesa_version }} \
            https://gitlab.freedesktop.org/mesa/mesa.git ~/mesa

      - name: Apply Termux Bionic patches
        run: |
          cd ~/mesa
          apply_termux_patch() {
            local patchfile="$1"
            echo "Applying $patchfile..."
            curl -sSfL "https://raw.githubusercontent.com/termux/termux-packages/master/packages/mesa/$patchfile" | patch -N -p1
          }

          apply_termux_patch "0000-disable-android-detection.patch"
          # 0007 replaced with direct sed fix (next step)
          apply_termux_patch "0014-replace-turnip-wait_timestamp_safe-assert.patch"
          #apply_termux_patch "0019-UBWC_5-and-UBWC_6-support.patch"
          apply_termux_patch "0016-unofficial_support_adreno_710_720.patch"
          #apply_termux_patch "0020-unofficial-support-adreno-830.patch"
          #apply_termux_patch "0021-unofficial-support-adreno-810-825-829.patch"

      - name: Apply Turnip pthread→mtx fix (replaces 0007)
        run: |
          cd ~/mesa
          sed -i 's/pthread_mutex_lock(&dev->pipeline_mutex)/mtx_lock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc
          sed -i 's/pthread_mutex_unlock(&dev->pipeline_mutex)/mtx_unlock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc
          echo "✔ tu_shader.cc: pthread_mutex → mtx_"

       
      
      - name: Override Vulkan API version
        if: github.event.inputs.api_override != ''
        run: |
          cd ~/mesa
          VER="${{ github.event.inputs.api_override }}"
          DEVFILE=$(find src/freedreno/vulkan -maxdepth 1 -name 'tu_device.*' -print -quit)
          if [ -z "$DEVFILE" ]; then
            echo "❌ Could not find tu_device file"
            exit 1
          fi
          echo "Forcing Vulkan API version to $VER in $DEVFILE"
          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER//\./_}/" "$DEVFILE"

      - name: Create Meson cross file for ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            CPU="aarch64"
            TARGET="aarch64-linux-android"
          else
            CPU="armv7l"
            TARGET="armv7a-linux-androideabi"
          fi
          API=28
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cat > ~/cross_file.txt << EOF
          [host_machine]
          system = 'linux'
          cpu_family = '$CPU'
          cpu = '$CPU'
          endian = 'little'

          [binaries]
          c = '$NDK_BIN/${TARGET}${API}-clang'
          cpp = '$NDK_BIN/${TARGET}${API}-clang++'
          ar = '$NDK_BIN/llvm-ar'
          strip = '$NDK_BIN/llvm-strip'
          pkg-config = 'pkg-config'

          [built-in options]
          c_args = ['-I/data/data/com.termux/files/usr/include']
          c_link_args = ['-L/data/data/com.termux/files/usr/lib', '-Wl,-rpath=/data/data/com.termux/files/usr/lib']
          EOF

      - name: Configure Mesa build for Turnip
        run: |
          meson setup build ~/mesa \
            --cross-file ~/cross_file.txt \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dplatforms=x11 \
            -Dandroid-libbacktrace=disabled \
            -Dllvm=disabled \
            -Dbuildtype=release \
            -Dprefix=/usr \
            -Dstrip=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Ddri3=disabled \
            -Dshader-cache=enabled

      - name: Build Turnip
        run: ninja -C build

      - name: Package artifact for ${{ matrix.arch }}
        run: |
          mkdir -p turnip_out
          cp build/src/freedreno/vulkan/libvulkan_freedreno.so turnip_out/
          if [ "${{ matrix.arch }}" = "arm" ]; then
            TARNAME=turnip-${{ github.event.inputs.mesa_version }}-arm.tar.xz
          else
            TARNAME=turnip-${{ github.event.inputs.mesa_version }}-aarch64.tar.xz
          fi
          tar -cJf $TARNAME -C turnip_out .
          echo "artifact_name=$TARNAME" >> $GITHUB_ENV

      - name: Upload ${{ matrix.arch }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.mesa_version }}-${{ matrix.arch }}
          path: turnip-${{ github.event.inputs.mesa_version }}-*.tar.xz
