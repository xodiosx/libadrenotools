name: Build Turnip for SurfaceFlinger (ARM64 Runner + Termux proot)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (e.g., mesa-26.0.1)'
        required: true
        default: 'main'
      api_override:
        description: 'Vulkan API override version (e.g., 1.4.301)'
        required: false
        default: '1.4.301'

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # Native ARM64 runner, no emulation
    steps:
      - name: Install host tools (proot)
        run: |
          sudo apt update
          sudo apt install -y proot wget tar

      - name: Download and extract Termux rootfs
        run: |
          # 1. Download the archive
          wget -q https://github.com/xodiosx/Wine-arm64ce/releases/download/wine-14/termux-rootfs.tar
          
          # 2. Extract into the host's actual root /data directory
          # We use sudo because /data is a system path on standard Ubuntu runner images
          sudo tar -xf termux-rootfs.tar -C /
          
          # 3. Create critical missing internal directories
          sudo mkdir -p /data/data/com.termux/files/usr/tmp
          sudo mkdir -p /data/data/com.termux/files/home
          
          # 4. Correct permissions to allow workflow user access inside the jail environment
          sudo chown -R $(whoami):$(whoami) /data/data/com.termux

      - name: Write build script inside rootfs
        run: |
          # Inject workflow variables directly into the script template to maintain scope inside proot
          cat << 'EOF' > /data/data/com.termux/files/home/build.sh
          #!/data/data/com.termux/files/usr/bin/bash
          set -e

          # Force standard Termux environment variable definitions
          export PREFIX="/data/data/com.termux/files/usr"
          export TMPDIR="/data/data/com.termux/files/usr/tmp"
          export HOME="/data/data/com.termux/files/home"
          export MESA_VERSION="${{ github.event.inputs.mesa_version }}"
          export API_OVERRIDE="${{ github.event.inputs.api_override }}"

          # System updates and required packages inside Termux
          apt update
          apt upgrade -y
          apt install -y \
            git make clang binutils ninja meson pkg-config python3-mako \
            glslang flex bison curl ca-certificates \
            libc++-dev zlib zstd patch coreutils

          # Clone Mesa
          git clone --depth 1 --branch "${MESA_VERSION}" \
            https://gitlab.freedesktop.org/mesa/mesa.git ${HOME}/mesa
          cd ${HOME}/mesa

          # Remove subprojects to prevent conflicting download calls during config
          rm -rf subprojects

          # Helper to apply Termux patches safely
          apply_termux_patch() {
            local patchfile="$1"
            echo "Applying $patchfile..."
            curl -sSfL \
              "https://raw.githubusercontent.com/termux/termux-packages/master/packages/mesa/$patchfile" | \
              patch -N -p1 || echo "Patch $patchfile already applied or skipped"
          }

          # Essential patches for building on Termux platforms
          apply_termux_patch "0000-disable-android-detection.patch"
          apply_termux_patch "0006-wsi-no-pthread_cancel.patch"
          apply_termux_patch "0014-replace-turnip-wait_timestamp_safe-assert.patch"
          apply_termux_patch "0015-define-reallocarray.patch"
          apply_termux_patch "0016-unofficial_support_adreno_710_720.patch"
          apply_termux_patch "0018-disable-general-layout-in-zink-for-turnip.patch"
          apply_termux_patch "0020-enable-android-stub.patch"

          # Inject modification patch for SurfaceFlinger output rename
          cat << 'RENAMEPATCH' > /data/data/com.termux/files/usr/tmp/rename.patch
          --- a/src/freedreno/vulkan/meson.build
          +++ b/src/freedreno/vulkan/meson.build
          @@ -176,7 +176,7 @@ tu_cpp_args += cpp.get_supported_arguments([
           ])
           
           libvulkan_freedreno = shared_library(
          -  'vulkan_freedreno',
          +  'vulkan_freedreno_surfaceflinger',
             [libtu_files, tu_entrypoints, tu_tracepoints, freedreno_xml_header_files, sha1_h, u_format_pack_h, bvh_spv],
             include_directories : libtu_includes,
             link_with : [
          @@ -237,7 +237,7 @@ freedreno_icd = custom_target(
             build_by_default : true,
             install_dir : with_vulkan_icd_dir,
             install_tag : 'runtime',
          -  install : true,
          +  install : false,
           )
           
           _dev_icdname = 'freedreno_devenv_icd.@0@.json'.format(host_machine.cpu())
          RENAMEPATCH
          
          patch -N -p1 < /data/data/com.termux/files/usr/tmp/rename.patch || echo "rename.patch already applied"

          # Force override Vulkan API Version if required
          if [ -n "${API_OVERRIDE}" ]; then
            DEVFILE=$(find src/freedreno/vulkan -maxdepth 1 -name 'tu_device.*' -print -quit)
            if [ -n "$DEVFILE" ]; then
              echo "Forcing Vulkan API version to ${API_OVERRIDE} in $DEVFILE"
              sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${API_OVERRIDE//\./_}/" "$DEVFILE"
            fi
          fi

          # Termux architecture-compliant options
          meson setup build . \
            --prefix="/data/data/com.termux/files/usr" \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dgallium-drivers= \
            -Degl=disabled \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=kgsl \
            -Dllvm=disabled \
            -Dbuildtype=release \
            -Dstrip=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dxmlconfig=disabled \
            -Dvalgrind=disabled \
            -Dvulkan-layers=

          ninja -C build

          # Copy target engine to runtime folder
          cp build/src/freedreno/vulkan/libvulkan_freedreno_surfaceflinger.so /data/data/com.termux/files/usr/tmp/
          EOF
          chmod +x /data/data/com.termux/files/home/build.sh

      - name: Run build inside Termux rootfs via proot (native aarch64)
        run: |
          # Use -r / so the environment matches the binary system hardcoding.
          # Bind /data explicitly so the proot layer sandboxes host storage execution cleanly.
          proot \
            -r / \
            -b /dev -b /proc -b /sys -b /data \
            -w /data/data/com.termux/files/home \
            /data/data/com.termux/files/usr/bin/env -i \
              HOME=/data/data/com.termux/files/home \
              TERM=xterm-256color \
              PATH=/data/data/com.termux/files/usr/bin:/bin:/usr/bin \
              /data/data/com.termux/files/usr/bin/bash /data/data/com.termux/files/home/build.sh

      - name: Package artifact
        run: |
          mkdir -p turnip_out
          cp /data/data/com.termux/files/usr/tmp/libvulkan_freedreno_surfaceflinger.so turnip_out/
          VER="${{ github.event.inputs.mesa_version }}"
          ARCH="aarch64"
          tar -cJf turnip-${VER}-${ARCH}.tar.xz -C turnip_out .
          echo "artifact_name=turnip-${VER}-${ARCH}.tar.xz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.mesa_version }}-aarch64
          path: turnip-*.tar.xz
