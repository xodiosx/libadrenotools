name: Build Turnip for Android (SurfaceFlinger + AHB, Vulkan 1.4)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: 'Mesa version (e.g., mesa-26.0.6)'
        required: true
        default: 'main'
      api_override:
        description: 'Vulkan API override version (e.g., 1.4.301)'
        required: false
        default: '1.4.301'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64]      # Hardcoded pure 64-bit focus
    steps:
      - name: Install host tools (meson 1.4.0)
        run: |
          sudo apt update
          sudo apt install -y ninja-build python3-mako glslang-tools flex bison curl
          pip install --user meson==1.4.0
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download and setup Android NDK (r27c)
        run: |
          NDK_VERSION="r27c"
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          wget -q "https://google.com{NDK_ZIP}"
          unzip -q ${NDK_ZIP} -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV
          chmod +x /opt/android-ndk-${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/*

      - name: Clone Mesa
        run: |
          git clone --depth 1 --branch ${{ github.event.inputs.mesa_version }} \
            https://freedesktop.org ~/mesa

      # -------------------- Patches (Ported from Gist logic) --------------------
      - name: Apply necessary patches
        run: |
          cd ~/mesa
          # Disable traditional desktop-Linux runtime asset probing logic
          curl -sSfL "https://githubusercontent.com" | patch -N -p1

          # pthread_mutex -> mtx_ translation layer
          sed -i 's/pthread_mutex_lock(&dev->pipeline_mutex)/mtx_lock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc
          sed -i 's/pthread_mutex_unlock(&dev->pipeline_mutex)/mtx_unlock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc

          # Inject Qualcomm Adreno 7xx architecture mappings
          curl -sSfL "https://githubusercontent.com" | patch -N -p1

      # -------------------- API Version Override --------------------
      - name: Override Vulkan API version
        if: github.event.inputs.api_override != ''
        run: |
          cd ~/mesa
          VER="${{ github.event.inputs.api_override }}"
          
          DEVFILE=$(find src/freedreno/vulkan -name 'tu_device.cc' -o -name 'tu_device.c' -print -quit)
          if [ -z "$DEVFILE" ]; then
            echo "❌ Could not find tu_device compilation targets"
            exit 1
          fi
          
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          echo "Forcing compilation profile targeting Vulkan ${MAJOR}.${MINOR}.${PATCH} inside $DEVFILE"
          
          # Match against modern macro layouts
          if grep -q "TU_API_VERSION" "$DEVFILE"; then
            sed -i "s/#define TU_API_VERSION .*/#define TU_API_VERSION VK_MAKE_VERSION($MAJOR, $MINOR, $PATCH)/g" "$DEVFILE"
          else
            sed -i -E "s/(api[_ ]?[Vv]ersion\s*=\s*).*;/\1VK_MAKE_API_VERSION(${MAJOR}, ${MINOR}, ${PATCH});/" "$DEVFILE"
          fi

      # -------------------- Cross file (Pure Android Layout) --------------------
      - name: Create Meson cross file for ${{ matrix.arch }}
        run: |
          CPU_FAMILY="aarch64"
          CPU="aarch64"
          TARGET="aarch64-linux-android"
          API_LEVEL=28 # Android Pie fallback baseline
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"

          > ~/cross_file.txt
          echo "[host_machine]" >> ~/cross_file.txt
          echo "system = 'android'" >> ~/cross_file.txt
          echo "cpu_family = '${CPU_FAMILY}'" >> ~/cross_file.txt
          echo "cpu = '${CPU}'" >> ~/cross_file.txt
          echo "endian = 'little'" >> ~/cross_file.txt
          echo "" >> ~/cross_file.txt
          echo "[binaries]" >> ~/cross_file.txt
          echo "c = '${NDK_BIN}/${TARGET}${API_LEVEL}-clang'" >> ~/cross_file.txt
          echo "cpp = '${NDK_BIN}/${TARGET}${API_LEVEL}-clang++'" >> ~/cross_file.txt
          echo "ar = '${NDK_BIN}/llvm-ar'" >> ~/cross_file.txt
          echo "strip = '${NDK_BIN}/llvm-strip'" >> ~/cross_file.txt
          echo "pkg-config = 'pkg-config'" >> ~/cross_file.txt

      # -------------------- Configure (Ported Gist Flags) --------------------
      - name: Configure Mesa build for Turnip
        run: |
          meson setup build ~/mesa \
            --cross-file ~/cross_file.txt \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dplatforms=android \
            -Dandroid-stub=true \
            -Dllvm=disabled \
            -Dbuildtype=release \
            -Dprefix=/usr \
            -Dstrip=true \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dglx=disabled \
            -Dshared-glapi=disabled \
            -Dshader-cache=disabled \
            -Dfreedreno-kmds=kgsl \
            -Dxmlconfig=disabled \
            -Dvalgrind=disabled \
            -Dzstd=disabled \
            -Dandroid-libbacktrace=disabled \
            -Dlibarchive:crypto=disabled \
            -Dlibarchive:openssl=disabled \
            -Dlibarchive:iconv=disabled

      - name: Build Turnip
        run: ninja -C build

      - name: Package artifact for ${{ matrix.arch }}
        run: |
          mkdir -p turnip_out
          cp build/src/freedreno/vulkan/libvulkan_freedreno.so turnip_out/
          TARNAME=turnip-surfaceflinger-${{ github.event.inputs.mesa_version }}-aarch64.tar.xz
          tar -cJf $TARNAME -C turnip_out .
          echo "TAR_NAME=$TARNAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-surfaceflinger-${{ github.event.inputs.mesa_version }}-${{ matrix.arch }}
          path: turnip-surfaceflinger-*.tar.xz
