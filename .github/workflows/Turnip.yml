name: Build Turnip for Termux (Bionic + Vulkan 1.4)

on:
  workflow_dispatch:
    inputs:
      mesa_version:
        description: Mesa version (e.g., mesa-26.0.6)
        required: true
        default: main
      api_override:
        description: Vulkan API override (e.g., 1.4.301)
        required: false
        default: 1.4.301

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        arch: [aarch64, arm]

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            meson ninja-build pkg-config python3 python3-mako \
            glslang-tools flex bison curl git unzip

      - name: Setup Android NDK
        run: |
          NDK_VERSION=r27c
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip
          unzip -q android-ndk-${NDK_VERSION}-linux.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Setup Termux sysroot
        run: |
          mkdir termux
          cd termux
          wget -q https://github.com/xodiosx/Wine-arm64ce/releases/download/wine-14/termux-rootfs.tar
          tar xf termux-rootfs.tar
          sudo mv data /data
          sudo chown -R $(whoami):$(whoami) /data
          mkdir -p /data/data/com.termux/files/usr/tmp
          sudo chmod -R a+rX /data/data/com.termux/files/usr

      - name: Clone Mesa
        run: |
          git clone --depth 1 \
            --branch "${{ github.event.inputs.mesa_version }}" \
            https://gitlab.freedesktop.org/mesa/mesa.git ~/mesa

      - name: Apply Termux patches
        run: |
          cd ~/mesa

          apply_patch() {
            curl -sSfL \
              https://raw.githubusercontent.com/termux/termux-packages/master/packages/mesa/$1 \
              | patch -N -p1
          }

          apply_patch 0000-disable-android-detection.patch
          apply_patch 0014-replace-turnip-wait_timestamp_safe-assert.patch
          apply_patch 0016-unofficial_support_adreno_710_720.patch

      - name: Fix pthread → mtx
        run: |
          cd ~/mesa
          sed -i 's/pthread_mutex_lock(&dev->pipeline_mutex)/mtx_lock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc || true
          sed -i 's/pthread_mutex_unlock(&dev->pipeline_mutex)/mtx_unlock(\&dev->pipeline_mutex)/g' src/freedreno/vulkan/tu_shader.cc || true

      - name: Override Vulkan API version
        if: ${{ github.event.inputs.api_override != '' }}
        run: |
          set -e
          cd ~/mesa

          VER="${{ github.event.inputs.api_override }}"
          VER_UNDERSCORE=$(echo $VER | tr '.' '_')

          FILE=$(find src/freedreno/vulkan -maxdepth 1 \( -name "tu_device.c" -o -name "tu_device.cc" \) | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: tu_device file not found"
            ls src/freedreno/vulkan
            exit 1
          fi

          echo "Patching $FILE → Vulkan $VER"

          sed -i "0,/VK_API_VERSION_[0-9_]*/s//VK_API_VERSION_${VER_UNDERSCORE}/" "$FILE"

      - name: Create cross file
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            CPU=aarch64
            TARGET=aarch64-linux-android
          else
            CPU=armv7l
            TARGET=armv7a-linux-androideabi
          fi

          API=28
          NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin

          cat > ~/cross_file.txt << EOF
          [host_machine]
          system = 'linux'
          cpu_family = '$CPU'
          cpu = '$CPU'
          endian = 'little'

          [binaries]
          c = '$NDK_BIN/${TARGET}${API}-clang'
          cpp = '$NDK_BIN/${TARGET}${API}-clang++'
           ar = '$NDK_BIN/llvm-ar'
           strip = '$NDK_BIN/llvm-strip'
           pkgconfig = 'pkg-config'

           [built-in options]
          c_args = ['-I/data/data/com.termux/files/usr/include']
          c_link_args = ['-L/data/data/com.termux/files/usr/lib', '-Wl,-rpath=/data/data/com.termux/files/usr/lib']
          EOF

      - name: Configure Mesa
        run: |
          meson setup build \
            --cross-file ~/cross_file.txt \
            -Dvulkan-drivers=freedreno \
            -Dgallium-drivers= \
            -Dplatforms=x11 \
            -Dandroid-libbacktrace=disabled \
            -Dllvm=disabled \
            -Dbuildtype=release \
            -Dprefix=/usr \
            -Dstrip=true \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled \
            -Dshared-glapi=disabled \
            -Ddri3=disabled \
            -Dshader-cache=enabled

      - name: Build
        run: |
          ninja -C build

      - name: Package
        run: |
          mkdir -p out
          cp build/src/freedreno/vulkan/libvulkan_freedreno.so out/

          if [ "${{ matrix.arch }}" = "arm" ]; then
            NAME=turnip-${{ github.event.inputs.mesa_version }}-arm.tar.xz
          else
            NAME=turnip-${{ github.event.inputs.mesa_version }}-aarch64.tar.xz
          fi

          tar -cJf $NAME -C out .
          echo "artifact_name=$NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ github.event.inputs.mesa_version }}-${{ matrix.arch }}
          path: turnip-${{ github.event.inputs.mesa_version }}-*.tar.xz
